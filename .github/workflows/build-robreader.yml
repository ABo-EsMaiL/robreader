name: build-robreader

# Builds the read-only kernel driver with the Windows Driver Kit that ships
# with the windows-2022 runner image, then signs it with a throw away test
# certificate (test signing mode accepts any certificate).
#
# Artifacts:
#   robreader-signed.sys  - the driver, ready to install in test mode
#   robreader-cert.cer    - the certificate, install it in Trusted Root
#   robreader.zip         - both of the above

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: locate the Windows Driver Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wdk = "${env:ProgramFiles(x86)}\Windows Kits\10"

          Write-Host "=== layout under $wdk ==="
          foreach ($sub in @('Include', 'Lib')) {
              $p = Join-Path $wdk $sub
              if (Test-Path $p) {
                  Write-Host "  $sub :"
                  Get-ChildItem $p -Directory -ErrorAction SilentlyContinue |
                      ForEach-Object { Write-Host "     $($_.Name)" }
              }
          }

          # find the kernel mode headers by looking for ntddk.h
          $ntddk = Get-ChildItem "$wdk\Include" -Recurse -Filter 'ntddk.h' `
                      -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ntddk) {
              Write-Host "ntddk.h not found - dumping the include tree"
              Get-ChildItem "$wdk\Include" -Recurse -Depth 3 -Directory |
                  Select-Object -First 60 FullName | Out-Host
              throw 'ntddk.h not found'
          }
          $kmInc = $ntddk.Directory.FullName            # ...\Include\<ver>\km
          $sharedInc = Join-Path (Split-Path $kmInc -Parent) 'shared'

          # find the kernel mode import libraries by looking for ntoskrnl.lib
          # (prefer the x64 flavour, the tree also contains arm64)
          $all = Get-ChildItem "$wdk\Lib" -Recurse -Filter 'ntoskrnl.lib' `
                      -ErrorAction SilentlyContinue
          if (-not $all) {
              Write-Host "ntoskrnl.lib not found - dumping the lib tree"
              Get-ChildItem "$wdk\Lib" -Recurse -Depth 3 -Directory |
                  Select-Object -First 60 FullName | Out-Host
              throw 'ntoskrnl.lib not found'
          }
          $ntoskrnl = $all | Where-Object { $_.FullName -match '\\x64\\' } |
                       Select-Object -First 1
          if (-not $ntoskrnl) { $ntoskrnl = $all[0] }
          $kmLib = $ntoskrnl.Directory.FullName          # ...\Lib\<ver>\x64\km

          Write-Host "km includes : $kmInc"
          Write-Host "km lib      : $kmLib"
          foreach ($l in @('ntoskrnl.lib', 'hal.lib', 'wmip.lib', 'ndis.lib')) {
              $p = Join-Path $kmLib $l
              Write-Host ("  {0}: {1}" -f $l, (Test-Path $p))
          }

          "KMINC=$kmInc"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "KMSH=$sharedInc"| Out-File -FilePath $env:GITHUB_ENV -Append
          "KMLIB=$kmLib"   | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: show toolchain
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          echo WDKINC=%WDKINC%
          echo WDKLIB=%WDKLIB%

      - name: build the driver
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          echo KMINC=%KMINC%
          echo KMSH=%KMSH%
          echo KMLIB=%KMLIB%
          del build.log 2>nul

          echo === compiling ===
          cl /nologo /kernel /c /Zl /W3 /GS- /GR- /EHs- /std:c17 ^
             /D_UNICODE /D_AMD64_ /D_AMD64 /D_X86_64 ^
             /I"%KMINC%" /I"%KMSH%" ^
             /I"%WindowsSdkDir%Include\%WindowsSDKVersion%\km" ^
             /I"%WindowsSdkDir%Include\%WindowsSDKVersion%\shared" ^
             /I"%WindowsSdkDir%Include\%WindowsSDKVersion%\ucrt" ^
             /Fo:robreader.obj driver\robreader.c > build.log 2>&1
          type build.log
          if not exist robreader.obj exit /b 1

          echo === linking ===
          echo === linking === >> build.log
          link /nologo /driver /subsystem:native /entry:DriverEntry /machine:x64 ^
              /nodefaultlib /merge:_TEXT=.text /export:DriverEntry ^
              /out:robreader.sys robreader.obj ^
              "%KMLIB%\ntoskrnl.lib" ^
              "%KMLIB%\hal.lib" >> build.log 2>&1
          type build.log
          if not exist robreader.sys exit /b 1

          echo === exports === >> build.log
          dumpbin /nologo /exports robreader.sys >> build.log 2>&1
          type build.log
          dir robreader.sys

      - name: upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # The kernel only accepts a driver signed with signtool: the PowerShell
      # Set-AuthenticodeSignature cmdlet does not add the page hashes that
      # Windows requires for kernel mode images, so such a driver is refused
      # with 577 even though Get-AuthenticodeSignature says "Valid".
      - name: sign with a throw away certificate
        continue-on-error: true
        shell: pwsh
        run: |
          $w = $env:GITHUB_WORKSPACE
          $pfx = Join-Path $w 'robreader.pfx'
          $cer = Join-Path $w 'robreader-cert.cer'
          $log = Join-Path $w 'sign.log'
          $pass = ConvertTo-SecureString -String 'robreader' -Force -AsPlainText
          "" | Out-File -FilePath $log -Encoding utf8
          function W($m) { $m | Tee-Object -FilePath $log -Append }

          try {
              $cert = New-SelfSignedCertificate -Type Custom `
                  -Subject 'CN=RobReader' `
                  -CertStoreLocation Cert:\CurrentUser\My `
                  -KeyAlgorithm RSA -KeyLength 2048 -KeySpec Signature `
                  -KeyUsage DigitalSignature `
                  -KeyExportPolicy Exportable `
                  -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3') `
                  -NotAfter (Get-Date).AddYears(10)
              W "certificate created: $($cert.Thumbprint)"
              Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pass | Out-Null
              Export-Certificate -Cert $cert -FilePath $cer | Out-Null
              W "exported pfx and cer"
          } catch {
              W "certificate error: $($_.Exception.Message)"
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { W "signtool.exe not found"; exit 0 }
          W "using $($signtool.FullName)"

          $target = Join-Path $w 'robreader.sys'
          & $signtool.FullName sign /v /fd sha256 /f $pfx /p robreader $target 2>&1 |
              ForEach-Object { W $_ }
          W "signtool exit code: $LASTEXITCODE"

          & $signtool.FullName verify /v /pa $target 2>&1 | ForEach-Object { W $_ }
          W "verify exit code: $LASTEXITCODE"

          $sig = Get-AuthenticodeSignature $target
          W "Get-AuthenticodeSignature status: $($sig.Status)"
          W "signer: $($sig.SignerCertificate.Subject)"
          W "thumbprint: $($sig.SignerCertificate.Thumbprint)"

      - name: upload the sign log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-log
          path: sign.log
          if-no-files-found: warn

      # Proof that a kernel with NORMAL signature enforcement accepts this
      # driver.  The GitHub runner has test signing off, so if the driver
      # loads here it will load on our machine as well.
      - name: can a normal kernel load this driver
        continue-on-error: true
        shell: pwsh
        run: |
          $w = $env:GITHUB_WORKSPACE
          $log = Join-Path $w 'loadtest.log'
          "" | Out-File -FilePath $log -Encoding utf8
          function W($m) { $m | Tee-Object -FilePath $log -Append }

          $cer = Join-Path $w 'robreader-cert.cer'
          $sys = Join-Path $w 'robreader.sys'
          if (-not (Test-Path $cer)) { W "no certificate - skipping"; exit 0 }

          W "=== trusting the certificate ==="
          foreach ($store in @("Root", "TrustedPublisher")) {
              Import-Certificate -FilePath $cer -CertStoreLocation "Cert:\LocalMachine\$store" | Out-Null
              W "  added to LocalMachine\$store"
          }
          $sig = Get-AuthenticodeSignature $sys
          W "signature status now: $($sig.Status)"

          W "=== loading the driver ==="
          & sc.exe create robreader type= kernel start= demand binPath= "$sys" 2>&1 |
              ForEach-Object { W $_ }
          & sc.exe start robreader 2>&1 | ForEach-Object { W $_ }
          Start-Sleep -Seconds 2
          & sc.exe query robreader 2>&1 | ForEach-Object { W $_ }

      - name: upload the load test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-log
          path: loadtest.log
          if-no-files-found: warn

      - name: package
        if: always()
        shell: pwsh
        run: |
          $w = $env:GITHUB_WORKSPACE
          $files = @()
          if (Test-Path "$w\robreader.sys") { $files += "$w\robreader.sys" }
          if (Test-Path "$w\robreader-cert.cer") { $files += "$w\robreader-cert.cer" }
          if ($files.Count -eq 0) {
              Write-Host 'nothing to package'
              exit 0
          }
          Compress-Archive -Path $files -DestinationPath "$w\robreader.zip" -Force
          Write-Host "packaged $($files.Count) file(s)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robreader-driver
          path: |
            robreader.zip
            robreader.sys
            robreader-cert.cer
          if-no-files-found: warn
