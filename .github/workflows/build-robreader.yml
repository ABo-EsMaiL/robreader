name: build-robreader

# Builds the read-only kernel driver with the Windows Driver Kit that ships
# with the windows-2022 runner image, then signs it with a throw away test
# certificate (test signing mode accepts any certificate).
#
# Artifacts:
#   robreader-signed.sys  - the driver, ready to install in test mode
#   robreader-cert.cer    - the certificate, install it in Trusted Root
#   robreader.zip         - both of the above

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: locate the Windows Driver Kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wdk = "${env:ProgramFiles(x86)}\Windows Kits\10"

          Write-Host "=== layout under $wdk ==="
          foreach ($sub in @('Include', 'Lib')) {
              $p = Join-Path $wdk $sub
              if (Test-Path $p) {
                  Write-Host "  $sub :"
                  Get-ChildItem $p -Directory -ErrorAction SilentlyContinue |
                      ForEach-Object { Write-Host "     $($_.Name)" }
              }
          }

          # find the kernel mode headers by looking for ntddk.h
          $ntddk = Get-ChildItem "$wdk\Include" -Recurse -Filter 'ntddk.h' `
                      -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ntddk) {
              Write-Host "ntddk.h not found - dumping the include tree"
              Get-ChildItem "$wdk\Include" -Recurse -Depth 3 -Directory |
                  Select-Object -First 60 FullName | Out-Host
              throw 'ntddk.h not found'
          }
          $kmInc = $ntddk.Directory.FullName            # ...\Include\<ver>\km
          $sharedInc = Join-Path (Split-Path $kmInc -Parent) 'shared'

          # find the kernel mode import libraries by looking for ntoskrnl.lib
          $ntoskrnl = Get-ChildItem "$wdk\Lib" -Recurse -Filter 'ntoskrnl.lib' `
                         -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ntoskrnl) {
              Write-Host "ntoskrnl.lib not found - dumping the lib tree"
              Get-ChildItem "$wdk\Lib" -Recurse -Depth 3 -Directory |
                  Select-Object -First 60 FullName | Out-Host
              throw 'ntoskrnl.lib not found'
          }
          $kmLib = $ntoskrnl.Directory.FullName          # ...\Lib\<ver>\x64\km

          Write-Host "km includes : $kmInc"
          Write-Host "km lib      : $kmLib"
          foreach ($l in @('hal.lib', 'wmip.lib', 'ndis.lib')) {
              $p = Join-Path $kmLib $l
              Write-Host ("  {0}: {1}" -f $l, (Test-Path $p))
          }

          "KMINC=$kmInc"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "KMSH=$sharedInc"| Out-File -FilePath $env:GITHUB_ENV -Append
          "KMLIB=$kmLib"   | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: show toolchain
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          echo WDKINC=%WDKINC%
          echo WDKLIB=%WDKLIB%

      - name: build the driver
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          echo KMINC=%KMINC%
          echo KMSH=%KMSH%
          echo KMLIB=%KMLIB%

          echo === compiling ===
          cl /nologo /kernel /c /Zl /Wv /GS- /GR- /EHs- /std:c17 ^
             /D_KERNEL_MODE /D_UNICODE /D_AMD64_ /D_AMD64 /D_X86_64 ^
             /I"%KMINC%" /I"%KMSH%" ^
             /I"%WindowsSdkDir%Include\%WindowsSDKVersion%\km" ^
             /I"%WindowsSdkDir%Include\%WindowsSDKVersion%\shared" ^
             /I"%WindowsSdkDir%Include\%WindowsSDKVersion%\ucrt" ^
             /Fo:robreader.obj driver\robreader.c
          if errorlevel 1 exit /b 1

          echo === linking ===
          link /nologo /driver /subsystem:native /entry:DriverEntry /machine:x64 ^
              /nodefaultlib /out:robreader.sys robreader.obj ^
              /lib:"%KMLIB%\ntoskrnl.lib" ^
              /lib:"%KMLIB%\hal.lib" ^
              /lib:"%KMLIB%\wmip.lib" ^
              /lib:"%KMLIB%\ndis.lib"
          if errorlevel 1 exit /b 1

          dir robreader.sys

      - name: sign with a throw away test certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $w = $env:GITHUB_WORKSPACE
          $pfx = Join-Path $w 'robreader.pfx'
          $cer = Join-Path $w 'robreader-cert.cer'
          $pass = ConvertTo-SecureString -String 'robreader' -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject 'CN=RobReader' `
              -CertStoreLocation Cert:\CurrentUser\My `
              -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
              -NotAfter (Get-Date).AddYears(3) `
              -Password $pass
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pass
          Export-Certificate -Cert $cert -FilePath $cer

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          Write-Host "using $($signtool.FullName)"
          & $signtool.FullName sign /v /fd sha256 /f $pfx /p robreader `
              (Join-Path $w 'robreader.sys')
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
          Get-AuthenticodeSignature (Join-Path $w 'robreader.sys') |
              Format-List Status, StatusMessage, SignerCertificate | Out-Host

      - name: package
        shell: pwsh
        run: |
          $w = $env:GITHUB_WORKSPACE
          Compress-Archive -Path "$w\robreader.sys", "$w\robreader-cert.cer" `
              -DestinationPath "$w\robreader.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: robreader-driver
          path: |
            robreader.zip
            robreader.sys
            robreader-cert.cer
