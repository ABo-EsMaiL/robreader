name: build-emulator

# Builds the Easy Anti-Cheat emulator:
#
#   emulator/src/win   -> EOSSDK-Win64-Shipping.dll   (replaces the game's EOS SDK)
#   emulator/src/linux -> version.dll                 (the local EAC server, side
#                                                    loaded next to the game exe)
#
# Both are plain Windows x64 DLLs, so the same MSVC toolchain that builds the
# kernel driver builds these too.
on:
  push:
    branches: [ main ]
    paths:
      - "emulator/**"
      - ".github/workflows/build-emulator.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: show the toolchain
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          cl 2>&1 | findstr Version
          cmake --version
          git --version

      - name: configure
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          del build.log 2>nul
          echo === configuring === > build.log
          cmake -S emulator -B emulator\build ^
              -G "Visual Studio 17 2022" -A x64 ^
              -DCMAKE_BUILD_TYPE=Release ^
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 >> build.log 2>&1
          type build.log
          if not exist emulator\build\CMakeCache.txt exit /b 1

      - name: build
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          echo === building === >> build.log
          cmake --build emulator\build --config Release --parallel >> build.log 2>&1
          type build.log
          if errorlevel 1 exit /b 1

      - name: collect the DLLs
        shell: cmd
        run: |-
          if not exist out mkdir out
          copy emulator\build\src\win\Release\EOSSDK-Win64-Shipping.dll out\ || exit /b 1
          copy emulator\build\src\linux\Release\EACServer.exe out\ || exit /b 1
          dir out
          type build.log
          echo === hashes === 
          for %%f in (out\*) do certutil -hashfile %%f SHA256
          if not exist out\EOSSDK-Win64-Shipping.dll exit /b 1
          if not exist out\EACServer.exe exit /b 1

      - name: upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-build-log
          path: build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eac-emulator
          path: out
          if-no-files-found: warn
